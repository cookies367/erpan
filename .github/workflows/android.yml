name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 手动把 runner 预装的 cmdline-tools 加入 PATH，并显式启用 ANDROID_HOME。
      # 不再使用 setup-android：它内部会拉取已被上游移除的 'tools' 包而直接失败。
      - name: Install Android platform and build-tools
        run: |
          set -u
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null || true
          TOOLS_BIN="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | tail -n 1)"
          if [ -z "$TOOLS_BIN" ]; then
            echo "::warning::cmdline-tools 未预装，改用 ZIP 安装"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q -o /tmp/tools.zip -d "$SDK/cmdline-tools/tmp"
            mkdir -p "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/tmp/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
            rm -rf "$SDK/cmdline-tools/tmp"
            TOOLS_BIN="$SDK/cmdline-tools/latest/bin"
          fi
          echo "$TOOLS_BIN" >> "$GITHUB_PATH"
          export PATH="$TOOLS_BIN:$PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :mobilevoice:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: erpan-debug-apk
          path: mobilevoice/build/outputs/apk/debug/*.apk
          if-no-files-found: error